<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monochrome notification icon. White circle with the LocateShoot "L"
  glyph knocked out as a transparent cutout. Used for both the large
  notification icon (rendered as-is on iOS + in the Android body) and
  the small status-bar badge on Android (Android reads the alpha
  channel and re-tints the visible pixels with the theme accent
  color — so the L stays punched-through on both surfaces).

  Same L path as icon.svg (Playfair Display Black glyph, hand-traced).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <mask id="l-cutout">
    <rect width="512" height="512" fill="white"/>
    <path fill="black" d="
      M 152 130
      L 232 130
      L 232 148
      L 220 148
      Q 210 148 207 154
      Q 204 160 204 174
      L 204 354
      L 280 354
      Q 296 354 304 348
      Q 312 342 318 326
      L 332 290
      L 348 290
      L 340 380
      L 152 380
      L 152 362
      L 164 362
      Q 174 362 177 356
      Q 180 350 180 336
      L 180 174
      Q 180 160 177 154
      Q 174 148 164 148
      L 152 148
      Z
    "/>
  </mask>
  <circle cx="256" cy="256" r="256" fill="white" mask="url(#l-cutout)"/>
</svg>
